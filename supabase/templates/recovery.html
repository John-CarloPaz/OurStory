<!doctype html>
<html>
  <body style="margin:0;background:#f6f0e6;font-family:Georgia,'Times New Roman',serif;color:#2a211d">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fffdf9;border-radius:20px;padding:40px">
          <tr><td>
            <p style="margin:0 0 8px;font:600 12px/1.4 -apple-system,'Segoe UI',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#b4553d">Our Story</p>
            <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2;font-weight:500">Reset your password</h1>
            <p style="margin:0 0 28px;font-size:17px;line-height:1.6">Use the button below to choose a new password for your Our Story account.</p>
            <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#b4553d;color:#ffffff;text-decoration:none;padding:14px 26px;border-radius:999px;font:600 15px/1 -apple-system,'Segoe UI',sans-serif">Choose a New Password</a>
            <p style="margin:28px 0 0;font:14px/1.6 -apple-system,'Segoe UI',sans-serif;color:#7a6c64">If you didn&#39;t ask for this, you can ignore this email. Your password won&#39;t change.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
